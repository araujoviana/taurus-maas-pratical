[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dashboard", "scenarios", "scripts"]

[project]
name = "taurus-maas-pratical"
version = "0.1.0"
description = "TaurusDB + MaaS AI demo for fintech enterprise presentation"
requires-python = ">=3.11"
authors = [{name = "Matheus Araujo", email = "dosamigosgpt@gmail.com"}]

dependencies = [
    "fastapi[standard]>=0.115.0",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",
    "openai>=1.50.0",
    "faker>=30.0.0",
    "python-dotenv>=1.1.0",
    "python-jose[cryptography]>=3.3.0",
    "huaweicloudsdkcore>=3.1.0",
    "paramiko>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
]
